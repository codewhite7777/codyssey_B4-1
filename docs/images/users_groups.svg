<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>계정과 그룹</title><rect width="680" height="520" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">계정 3개를 그룹 2개에 넣는다</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">계정 = 사람 한 명 (로그인 가능)   ·   그룹 = 사람들의 명단 (로그인 못 함, 권한을 받는 단위)</text><text x="130" y="84" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#2C2C2A">계정 (사람)</text><rect x="40" y="100" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="130.0" y="118.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-admin</text><text x="130.0" y="138.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">운영 · 관리</text><text x="130.0" y="154.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">앱 실행, cron 실행자</text><rect x="40" y="196" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="130.0" y="214.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-dev</text><text x="130.0" y="234.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">개발</text><text x="130.0" y="250.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">monitor.sh 작성자</text><rect x="40" y="292" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="130.0" y="310.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-test</text><text x="130.0" y="330.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">테스트</text><text x="130.0" y="346.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">공용 공간만 사용</text><text x="560" y="84" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#2C2C2A">그룹 (명단)</text><rect x="450" y="106" width="220" height="104" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="560" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0C447C">agent-common</text><text x="560" y="150" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#185FA5">공용 그룹</text><text x="560" y="172" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#185FA5">→ upload_files</text><text x="560" y="192" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#0C447C">명단: admin, dev, test</text><rect x="450" y="246" width="220" height="124" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="560" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">agent-core</text><text x="560" y="290" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#534AB7">핵심 그룹</text><text x="560" y="312" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#534AB7">→ api_keys, 로그 폴더,</text><text x="560" y="330" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#534AB7">    monitor.sh</text><text x="560" y="354" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#3C3489">명단: admin, dev</text><line x1="222" y1="130" x2="448" y2="140" stroke="#185FA5" stroke-width="1.6"/><path d="M441.6 142.8 L448 140 L441.8 136.7" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linejoin="round"/><line x1="222" y1="226" x2="448" y2="158" stroke="#185FA5" stroke-width="1.6"/><path d="M442.8 162.7 L448 158 L441.1 156.9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linejoin="round"/><line x1="222" y1="322" x2="448" y2="176" stroke="#185FA5" stroke-width="1.6"/><path d="M444.4 182.0 L448 176 L441.1 176.9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linejoin="round"/><line x1="222" y1="148" x2="448" y2="290" stroke="#534AB7" stroke-width="1.6"/><path d="M441.0 289.2 L448 290 L444.3 284.1" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linejoin="round"/><line x1="222" y1="244" x2="448" y2="310" stroke="#534AB7" stroke-width="1.6"/><path d="M441.1 311.2 L448 310 L442.8 305.3" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linejoin="round"/><line x1="222" y1="342" x2="330" y2="330" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="342" cy="334" r="10" fill="#A32D2D"/><path d="M338 330 L346 338 M346 330 L338 338" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><text x="342" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#A32D2D">test는 core에 안 들어감</text><rect x="30" y="396" width="620" height="108" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="46" y="416" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#633806">알아둘 점</text><text x="46" y="440" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">① 그룹에는 상하 관계가 없다. core에 넣어도 common에 자동으로 들어가지 않으니 각각 넣는다.</text><text x="46" y="459" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">② 넣는 명령: sudo usermod -aG 그룹1,그룹2 계정   (-a를 빼면 기존 그룹이 다 빠지니 꼭 -aG)</text><text x="46" y="478" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">③ 계정을 만들면 같은 이름의 '개인 그룹'(예: agent-admin)이 자동으로 생긴다. 본인만 든 그룹이라 신경 X</text><text x="46" y="497" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">④ 확인: id agent-admin  →  groups=... agent-common, agent-core</text></svg>