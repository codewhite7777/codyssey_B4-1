<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>계정과 그룹</title><rect width="680" height="360" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">사람 3명, 그룹 2개: agent-core는 agent-common 안에 있다</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">그룹 = 같은 권한을 받는 사람들의 묶음. 사람마다 따로 권한을 주지 않고 그룹에 준다</text><rect x="30" y="80" width="620" height="196" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="48" y="100" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#0C447C">agent-common  (공용 공간: upload_files)</text><rect x="50" y="116" width="390" height="146" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="66" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#3C3489">agent-core  (비밀 · 운영 공간: api_keys, 로그, monitor.sh)</text><rect x="70" y="156" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="155.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-admin</text><text x="155.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">운영 · 관리</text><text x="155.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">cron 실행자</text><rect x="256" y="156" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="341.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-dev</text><text x="341.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">개발 · 운영</text><text x="341.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">monitor.sh 작성자</text><rect x="462" y="156" width="170" height="88" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="547.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">agent-test</text><text x="547.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">QA · 테스트</text><text x="547.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">공용 공간만</text><text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C2C2A">admin, dev → 두 그룹 모두  /  test → agent-common만</text><text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">확인 명령: id agent-admin · id agent-dev · id agent-test</text></svg>