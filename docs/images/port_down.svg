<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>프로세스는 있는데 포트가 안 열림</title><rect width="680" height="500" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">프로세스는 살아 있는데 포트가 안 열렸다: 확인 순서</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">빠르고 흔한 원인부터 하나씩 지운다</text><rect x="30" y="78" width="620" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="48" y="98" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">1. 앱이 뭐라고 했나</text><text x="48" y="124" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">앱 출력에서 Boot 몇 단계에서 멈췄는지 · 에러 메시지</text><text x="632" y="98" text-anchor="end" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#6B6A64">원인: 부팅 실패 · 아직 부팅 중</text><rect x="30" y="160" width="620" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="48" y="180" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">2. 포트 번호가 맞나</text><text x="48" y="206" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">echo $AGENT_PORT  /  ss -ltnp</text><text x="632" y="180" text-anchor="end" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#6B6A64">원인: 다른 포트로 떠 있음 (환경변수 오타)</text><line x1="340" y1="146" x2="340" y2="159" stroke="#5F5E5A" stroke-width="1.3"/><path d="M337.0 152.7 L340 159 L343.0 152.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="242" width="620" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="48" y="262" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">3. 다른 프로그램이 차지했나</text><text x="48" y="288" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">ss -ltnp | grep 15034  → PID가 앱과 다른가</text><text x="632" y="262" text-anchor="end" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#6B6A64">원인: 포트 충돌 (예전 앱이 아직 살아 있음)</text><line x1="340" y1="228" x2="340" y2="241" stroke="#5F5E5A" stroke-width="1.3"/><path d="M337.0 234.7 L340 241 L343.0 234.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="324" width="620" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="48" y="344" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#3C3489">4. 앱이 멈춰 있나</text><text x="48" y="370" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">ps -o pid,stat,etime -p &lt;PID&gt;</text><text x="632" y="344" text-anchor="end" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#6B6A64">원인: 멈춤(T) · 무한 대기 → 재시작 필요</text><line x1="340" y1="310" x2="340" y2="323" stroke="#5F5E5A" stroke-width="1.3"/><path d="M337.0 316.7 L340 323 L343.0 316.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="406" width="620" height="68" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/><text x="48" y="426" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#2C2C2A">5. 그래도 모르겠으면</text><text x="48" y="452" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">Ctrl+C로 끄고 다시 실행 → 출력 비교</text><text x="632" y="426" text-anchor="end" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#6B6A64">재현되면 앱 로그와 함께 개발자에게 전달</text><line x1="340" y1="392" x2="340" y2="405" stroke="#5F5E5A" stroke-width="1.3"/><path d="M337.0 398.7 L340 405 L343.0 398.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/></svg>