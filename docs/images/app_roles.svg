<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>제공 앱이 하는 일</title><rect width="680" height="400" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">제공 앱(agent-app-linux)이 하는 일: 채점기 + 연습 상대</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">실행하면 먼저 내 세팅을 검사하고, 통과하면 일부러 CPU · 메모리를 쓰며 계속 돈다</text><rect x="30" y="86" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/><text x="90.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">./agent-app</text><text x="90.0" y="119.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">agent-admin으로 실행</text><line x1="152" y1="111" x2="178" y2="111" stroke="#5F5E5A" stroke-width="1.3"/><path d="M171.7 114.0 L178 111 L171.7 108.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="180" y="76" width="470" height="92" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="196" y="94" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#3C3489">① 채점기: 부팅 검사 5가지</text><rect x="196" y="108" width="82" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="237.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">[1/5]</text><text x="237.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">실행 계정</text><rect x="285" y="108" width="82" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="326.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">[2/5]</text><text x="326.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">환경변수</text><rect x="374" y="108" width="82" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="415.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">[3/5]</text><text x="415.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">키 파일</text><rect x="463" y="108" width="82" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="504.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">[4/5]</text><text x="504.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">포트 15034</text><rect x="552" y="108" width="82" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="593.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">[5/5]</text><text x="593.0" y="138.5" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">로그 폴더</text><line x1="300" y1="170" x2="300" y2="196" stroke="#A32D2D" stroke-width="1.3"/><path d="M297.0 189.7 L300 196 L303.0 189.7" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-linejoin="round"/><text x="312" y="183" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#A32D2D">하나라도 틀림</text><rect x="180" y="198" width="240" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="300.0" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#791F1F">[FAIL] + 이유 출력 → 종료</text><text x="300.0" y="228.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#A32D2D">예: Missing File: secret.key</text><line x1="540" y1="170" x2="540" y2="196" stroke="#0F6E56" stroke-width="1.3"/><path d="M537.0 189.7 L540 196 L543.0 189.7" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-linejoin="round"/><text x="552" y="183" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#0F6E56">모두 [OK]</text><rect x="440" y="198" width="210" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="545.0" y="221.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Agent READY</text><line x1="545" y1="246" x2="545" y2="268" stroke="#0F6E56" stroke-width="1.3"/><path d="M542.0 261.7 L545 268 L548.0 261.7" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="270" width="620" height="112" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="46" y="290" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#633806">② 연습 상대: READY 이후 계속 하는 일</text><rect x="46" y="304" width="188" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="140.0" y="317.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">15034 포트 열기</text><text x="140.0" y="335.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">열어 두기만 함</text><text x="140.0" y="351.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">요청에 응답은 안 함</text><rect x="246" y="304" width="188" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="340.0" y="317.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">CPU · 메모리 부하 반복</text><text x="340.0" y="335.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">약 100초마다 한 바퀴</text><text x="340.0" y="351.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">올렸다 → 내렸다</text><rect x="446" y="304" width="188" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="540.0" y="317.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#444441">자기 로그 쓰기</text><text x="540.0" y="335.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">agent_app.log</text><text x="540.0" y="351.75" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">1분에 약 3.3KB</text></svg>