<svg xmlns="http://www.w3.org/2000/svg" width="680" height="656" viewBox="0 0 680 656" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>B4-1 전체 흐름</title><rect width="680" height="656" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">B4-1 전체 흐름: 위에서부터 차례로</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">비유: 건물(서버) 문을 잠그고 → 출입증을 나눠 주고 → 가게(앱)를 열고 → 경비원이 1분마다 순찰 일지를 쓴다</text><rect x="40" y="84" width="440" height="54" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="260.0" y="99.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">1. SSH 잠그기</text><text x="260.0" y="119.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#A32D2D">접속 포트 22 → 20022, root 원격 로그인 금지</text><rect x="40" y="154" width="440" height="54" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="260.0" y="169.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">2. 방화벽 켜기</text><text x="260.0" y="189.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#A32D2D">UFW: 기본 전부 차단, 20022 · 15034만 허용</text><line x1="260" y1="138" x2="260" y2="153" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 146.7 L260 153 L263.0 146.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="224" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="260.0" y="239.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">3. 계정 · 그룹 만들기</text><text x="260.0" y="259.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">agent-admin / dev / test, agent-common / core</text><line x1="260" y1="208" x2="260" y2="223" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 216.7 L260 223 L263.0 216.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="294" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="260.0" y="309.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">4. 폴더 · 권한 정하기</text><text x="260.0" y="329.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">upload_files는 공용, api_keys · 로그는 core만</text><line x1="260" y1="278" x2="260" y2="293" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 286.7 L260 293 L263.0 286.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="364" width="440" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/><text x="260.0" y="379.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">5. 환경변수 + 키 파일</text><text x="260.0" y="399.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">AGENT_HOME, AGENT_PORT=15034 …, api_keys/secret.key</text><line x1="260" y1="348" x2="260" y2="363" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 356.7 L260 363 L263.0 356.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="434" width="440" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/><text x="260.0" y="449.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">6. 앱 실행</text><text x="260.0" y="469.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">Boot 5단계 [OK] → Agent READY, 15034 LISTEN</text><line x1="260" y1="418" x2="260" y2="433" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 426.7 L260 433 L263.0 426.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="504" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="260.0" y="519.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">7. monitor.sh 만들기</text><text x="260.0" y="539.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">프로세스 · 포트 · 방화벽 · 자원 점검 → monitor.log</text><line x1="260" y1="488" x2="260" y2="503" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 496.7 L260 503 L263.0 496.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><rect x="40" y="574" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="260.0" y="589.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">8. cron + logrotate</text><text x="260.0" y="609.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">1분마다 자동 실행, 10MB 넘으면 10개까지 보관</text><line x1="260" y1="558" x2="260" y2="573" stroke="#5F5E5A" stroke-width="1.3"/><path d="M257.0 566.7 L260 573 L263.0 566.7" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><path d="M490 84 L500 84 L500 208 L490 208" fill="none" stroke="#888780" stroke-width="1"/><text x="512" y="137.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#2C2C2A">보안</text><text x="512" y="156.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">문 잠그기</text><path d="M490 224 L500 224 L500 348 L490 348" fill="none" stroke="#888780" stroke-width="1"/><text x="512" y="277.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#2C2C2A">사람과 폴더</text><text x="512" y="296.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">출입증 나누기</text><path d="M490 364 L500 364 L500 488 L490 488" fill="none" stroke="#888780" stroke-width="1"/><text x="512" y="417.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#2C2C2A">앱 띄우기</text><text x="512" y="436.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">가게 열기</text><path d="M490 504 L500 504 L500 628 L490 628" fill="none" stroke="#888780" stroke-width="1"/><text x="512" y="557.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#2C2C2A">자동 점검 (핵심)</text><text x="512" y="576.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">경비원 + 일지</text></svg>