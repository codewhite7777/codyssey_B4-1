<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>대상이 Nginx로 바뀐다면</title><rect width="680" height="330" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">감시 대상이 Nginx로 바뀌면 바꿀 곳 4가지</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">스크립트 구조(확인 → 수집 → 경고 → 기록)는 그대로, 값만 바꾼다</text><rect x="30" y="76" width="110" height="34" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="85.0" y="93" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">항목</text><rect x="140" y="76" width="245" height="34" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="262.5" y="93" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">지금 (agent app)</text><rect x="385" y="76" width="265" height="34" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="517.5" y="93" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">Nginx라면</text><rect x="30" y="110" width="110" height="46" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="85" y="133" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#3C3489">프로세스</text><rect x="140" y="110" width="245" height="46" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.6"/><text x="152" y="133" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">pgrep -f 'agent_app.py|…'</text><rect x="385" y="110" width="265" height="46" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="397" y="133" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">pgrep -x nginx</text><rect x="30" y="156" width="110" height="46" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="85" y="179" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#3C3489">포트</text><rect x="140" y="156" width="245" height="46" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.6"/><text x="152" y="179" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">15034</text><rect x="385" y="156" width="265" height="46" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="397" y="179" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">80 / 443  (+ 방화벽도 열기)</text><rect x="30" y="202" width="110" height="46" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="85" y="225" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#3C3489">로그</text><rect x="140" y="202" width="245" height="46" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.6"/><text x="152" y="225" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">monitor.log 한 개</text><rect x="385" y="202" width="265" height="46" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="397" y="225" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">access.log · error.log도 같이 보기</text><rect x="30" y="248" width="110" height="46" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text x="85" y="271" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#3C3489">임계값</text><rect x="140" y="248" width="245" height="46" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.6"/><text x="152" y="271" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">CPU 20 · MEM 10 · DISK 80</text><rect x="385" y="248" width="265" height="46" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="397" y="271" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">평소 트래픽 기준으로 다시 정하기</text><text x="340" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#6B6A64">추가로: 5xx 응답이 늘었는지(error.log) 보면 '살아 있지만 고장'도 잡을 수 있다</text></svg>