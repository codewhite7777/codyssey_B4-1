<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>로그 급증 대응</title><rect width="680" height="400" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">로그가 급증해 디스크가 찰 것 같을 때</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">단기 = 지금 불 끄기,  중기 = 다시 안 생기게 하기</text><rect x="30" y="74" width="300" height="306" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="180" y="98" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#791F1F">단기 (지금 바로)</text><rect x="46" y="118" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="60" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">df -h / du -sh /var/log/*</text><text x="60" y="156" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">무엇이 디스크를 먹는지 찾기</text><rect x="46" y="182" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="60" y="200" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">: &gt; monitor.log</text><text x="60" y="220" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">열린 파일은 rm 대신 비우기</text><rect x="46" y="246" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="60" y="264" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">오래된 .1 ~ .10 정리</text><text x="60" y="284" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">압축하거나 백업 후 삭제</text><rect x="46" y="310" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="60" y="328" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">같은 에러가 반복되나 확인</text><text x="60" y="348" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">원인 프로세스 재시작 · 멈춤</text><rect x="350" y="74" width="300" height="306" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="500" y="98" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#085041">중기 (구조 바꾸기)</text><rect x="366" y="118" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="380" y="136" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">logrotate 기준 조정</text><text x="380" y="156" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">size 낮추기 · compress · 더 자주</text><rect x="366" y="182" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="380" y="200" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">로그 전용 파티션 분리</text><text x="380" y="220" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">로그가 차도 / 는 안전</text><rect x="366" y="246" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="380" y="264" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">DISK 경고를 알림으로</text><text x="380" y="284" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">80%에서 사람에게 알리기</text><rect x="366" y="310" width="268" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="380" y="328" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">원인 고치기</text><text x="380" y="348" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#6B6A64">같은 줄을 반복해서 찍는 코드 수정</text></svg>