<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>경고와 종료를 나눈 이유</title><rect width="680" height="360" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">왜 어떤 건 멈추고(exit 1), 어떤 건 경고만 하나?</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">기준: '지금 서비스가 돌아가고 있나?'</text><rect x="30" y="74" width="300" height="266" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="180" y="98" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#791F1F">멈춤 (exit 1)</text><rect x="50" y="116" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="180" y="133" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C2C2A">앱 프로세스가 없음</text><rect x="50" y="160" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="180" y="177" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C2C2A">15034 포트가 안 열림</text><text x="54" y="226" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="700" fill="#791F1F">이유</text><text x="54" y="250" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#791F1F">서비스가 이미 멈춘 상태</text><text x="54" y="274" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#791F1F">→ 자원을 재서 기록해도 의미가 없다</text><text x="54" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#791F1F">→ 종료 코드 1로 '고장'을 확실히 알린다</text><rect x="350" y="74" width="300" height="266" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="500" y="98" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#633806">경고만 (계속)</text><rect x="370" y="116" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="500" y="133" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C2C2A">방화벽이 꺼져 있음</text><rect x="370" y="160" width="260" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/><text x="500" y="177" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#2C2C2A">CPU &gt; 20 · MEM &gt; 10 · DISK &gt; 80</text><text x="374" y="226" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="700" fill="#633806">이유</text><text x="374" y="250" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">서비스는 아직 돌고 있다</text><text x="374" y="274" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">→ 여기서 멈추면 기록이 끊겨 추세를 잃는다</text><text x="374" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">→ 사람이 판단하도록 신호만 준다</text></svg>