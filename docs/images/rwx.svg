<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>권한 숫자 읽는 법</title><rect width="680" height="340" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">권한 숫자 읽는 법: 750 = rwx r-x ---</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">r(읽기)=4, w(쓰기)=2, x(실행 · 폴더는 '들어가기')=1 을 더한 값</text><rect x="60" y="82" width="160" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="140" y="116" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#085041">7</text><text x="140" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#085041" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">rwx</text><text x="140" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">소유자 (4+2+1)</text><rect x="260" y="82" width="160" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/><text x="340" y="116" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#0C447C">5</text><text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#0C447C" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">r-x</text><text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">그룹 (4+0+1)</text><rect x="460" y="82" width="160" height="120" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="540" y="116" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="#791F1F">0</text><text x="540" y="152" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#791F1F" font-family="'SFMono-Regular', Menlo, Consolas, 'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace">---</text><text x="540" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#A32D2D">그 외 모두 (0+0+0)</text><rect x="40" y="222" width="290" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/><text x="185.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#3C3489">앞에 붙은 2  (2770, 2750)</text><text x="185.0" y="269.75" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">setgid: 폴더 안에 새로 만든 파일이</text><text x="185.0" y="286.75" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">폴더의 그룹을 물려받음 (ls에서 s)</text><rect x="350" y="222" width="290" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="495.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#633806">ls 끝의 +  (drwxrws---+)</text><text x="495.0" y="269.75" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B">ACL이 붙어 있다는 표시</text><text x="495.0" y="286.75" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B">자세히 보기: getfacl 경로</text></svg>