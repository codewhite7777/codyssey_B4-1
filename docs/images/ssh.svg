<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>SSH 포트 변경과 root 차단</title><rect width="680" height="440" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">SSH 설정: 공격 봇의 1 · 2단계를 막는다</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">위협 모델 = '누가, 어떤 순서로 공격하는가'를 먼저 그려 보고 막을 곳을 정하는 것</text><text x="160" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#791F1F">공격 봇이 하는 일</text><text x="500" y="88" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#085041">우리 설정</text><rect x="30" y="106" width="260" height="72" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="160.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">① 22번 포트를 찾는다</text><text x="160.0" y="142.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">인터넷 전체를 자동으로 훑으며</text><text x="160.0" y="158.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">22번(SSH 기본)이 열린 서버를 찾음</text><rect x="390" y="106" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="520.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Port 20022</text><text x="520.0" y="142.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">기본 22만 두드리는 봇에게 안 보임</text><text x="520.0" y="158.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">→ 무작위 시도 · 로그 소음이 줄어듦</text><line x1="388" y1="142" x2="294" y2="142" stroke="#0F6E56" stroke-width="1.6"/><path d="M300.3 139.0 L294 142 L300.3 145.0" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linejoin="round"/><text x="341" y="132" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#0F6E56">막음</text><line x1="160" y1="178" x2="160" y2="193" stroke="#A32D2D" stroke-width="1.3"/><path d="M157.0 186.7 L160 193 L163.0 186.7" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="194" width="260" height="72" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="160.0" y="210.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">② root로 비밀번호를 대입</text><text x="160.0" y="230.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">root는 모든 리눅스에 있는 이름</text><text x="160.0" y="246.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">→ 아이디는 이미 아는 셈</text><rect x="390" y="194" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="520.0" y="210.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">PermitRootLogin no</text><text x="520.0" y="230.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">비밀번호를 맞혀도 root로는 거절</text><text x="520.0" y="246.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">→ 공격자가 아이디부터 알아내야 함</text><line x1="388" y1="230" x2="294" y2="230" stroke="#0F6E56" stroke-width="1.6"/><path d="M300.3 227.0 L294 230 L300.3 233.0" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linejoin="round"/><text x="341" y="220" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#0F6E56">막음</text><line x1="160" y1="266" x2="160" y2="281" stroke="#A32D2D" stroke-width="1.3"/><path d="M157.0 274.7 L160 281 L163.0 274.7" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-linejoin="round"/><rect x="30" y="282" width="260" height="72" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/><text x="160.0" y="298.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">③ 맞히면 서버 전체 장악</text><text x="160.0" y="318.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">root = 무엇이든 할 수 있는 계정</text><text x="160.0" y="334.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#A32D2D">파일 삭제, 키 유출, 악성코드 설치</text><rect x="390" y="282" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/><text x="520.0" y="298.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">일반 계정 + sudo</text><text x="520.0" y="318.25" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">들어와도 권한이 제한됨</text><text x="520.0" y="334.75" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">누가 sudo를 썼는지 기록이 남음</text><line x1="388" y1="318" x2="294" y2="318" stroke="#0F6E56" stroke-width="1.6"/><path d="M300.3 315.0 L294 318 L300.3 321.0" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linejoin="round"/><text x="341" y="308" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#0F6E56">막음</text><rect x="30" y="378" width="620" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/><text x="340" y="391" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">주의: 포트 변경은 '숨기기'일 뿐, 포트 스캔을 하면 20022도 찾을 수 있다.</text><text x="340" y="409" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">그래서 방화벽 · root 차단 · (가능하면) 키 인증과 겹겹이 함께 쓴다.</text></svg>