idth="0.6"/><text x="227.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#085041">✓</text><rect x="274" y="320" width="94" height="40" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="321.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#085041">✓</text><rect x="368" y="320" width="94" height="40" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text x="415.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#633806">△</text><rect x="462" y="320" width="94" height="40" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.6"/><text x="509.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#791F1F">✗</text><rect x="556" y="320" width="94" height="40" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text x="603.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#633806">△</text><text x="30" y="378" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">VMware Fusion △: 개인 사용은 무료지만 Broadcom 계정 가입이 필요</text><text x="30" y="397" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">VirtualBox △: Apple Silicon 지원이 7.1(2024년)부터라 Arm 호스트 제한 사항이 남아 있음</text><text x="30" y="416" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">Multipass ✗: 접속(multipass shell)이 SSH를 쓰고 콘솔 창이 없음 → 1~2단계에서 SSH를 바꾸다 막히면 복구가 어려움</text><text x="30" y="435" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">Docker ✗: 기본 컨테이너에는 systemd가 없어 sshd · ufw · cron이 '부팅 때 켜지는 서비스'로 동작하지 않음</text><text x="30" y="454" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#6B6A64">EC2: 프리 티어를 넘으면 과금, 잠기면 시리얼 콘솔 설정 필요, 평가 때 인스턴스를 켜 둬야 함</text></svg>