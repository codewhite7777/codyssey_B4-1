<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>실습 환경 비교</title><rect width="680" height="470" fill="#FFFFFF" rx="12"/><text x="340.0" y="30" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#2C2C2A">Mac M칩에서 이 과제를 할 환경 비교</text><text x="340.0" y="54" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#6B6A64">기준 5개를 모두 채우는가? (✓ 채움, △ 조건부, ✗ 못 채움)</text><rect x="30" y="74" width="150" height="46" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="105.0" y="97.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2C2C2A">방식</text><rect x="180" y="74" width="94" height="46" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="227.0" y="89" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">① 진짜 서버처럼</text><text x="227.0" y="105" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">(systemd)</text><rect x="274" y="74" width="94" height="46" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="321.0" y="89" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">② M칩에서</text><text x="321.0" y="105" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">빠르게 (ARM)</text><rect x="368" y="74" width="94" height="46" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="415.0" y="89" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">③ SSH 잠겨도</text><text x="415.0" y="105" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#2C2C2A">콘솔로 복구</text><rect x="462" y="74" width="94" hei